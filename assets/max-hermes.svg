<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="240" rx="24" fill="url(#bg)"/>
  <!-- chat bubble -->
  <rect x="60" y="70" width="120" height="90" rx="20" fill="url(#accent)" opacity="0.9"/>
  <path d="M80 160 L80 190 L120 160 Z" fill="url(#accent)" opacity="0.9"/>
  <circle cx="120" cy="115" r="10" fill="#1a1a2e"/>
  <!-- hermes node -->
  <circle cx="280" cy="115" r="28" fill="none" stroke="url(#accent)" stroke-width="6"/>
  <circle cx="280" cy="115" r="10" fill="url(#accent)"/>
  <!-- connector lines -->
  <line x1="180" y1="115" x2="250" y2="115" stroke="url(#accent)" stroke-width="4" stroke-dasharray="8 6"/>
  <line x1="310" y1="115" x2="520" y2="115" stroke="url(#accent)" stroke-width="4" stroke-dasharray="8 6"/>
  <!-- MAX logo text -->
  <text x="540" y="125" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="bold" fill="#ffffff">MAX</text>
  <text x="540" y="160" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#f59e0b">× Hermes</text>
  <!-- subtitle -->
  <text x="400" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8">Russian messenger as a channel for Hermes Agent</text>
</svg>
